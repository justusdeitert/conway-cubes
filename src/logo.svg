<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- The main container rotated 45 degrees -->
    <g transform="translate(100, 100) rotate(45)">
        <!-- Background grid container -->
        <rect x="-70" y="-70" width="140" height="140" rx="8" fill="#111113" stroke="#27272a" stroke-width="4"/>
        
        <!-- The Grid Lines (subtle) -->
        <g stroke="#27272a" stroke-width="2" opacity="0.5">
            <line x1="-35" y1="-70" x2="-35" y2="70"/>
            <line x1="0" y1="-70" x2="0" y2="70"/>
            <line x1="35" y1="-70" x2="35" y2="70"/>
            <line x1="-70" y1="-35" x2="70" y2="-35"/>
            <line x1="-70" y1="0" x2="70" y2="0"/>
            <line x1="-70" y1="35" x2="70" y2="35"/>
        </g>

        <!-- The Active Cells forming a Glider -->
        <!-- Using the 'accent-bright' color with a slight glow effect via stroke -->
        <g fill="#34d399" stroke="#34d399" stroke-width="2">
            <!-- Glider pattern coordinates on a 4x4 grid -->
            <rect x="-32" y="-67" width="28" height="28" rx="4" /> <!-- Top middle -->
            <rect x="3" y="-32" width="28" height="28" rx="4" /> <!-- Middle right -->
            <rect x="-67" y="3" width="28" height="28" rx="4" /> <!-- Bottom left -->
            <rect x="-32" y="3" width="28" height="28" rx="4" /> <!-- Bottom middle -->
            <rect x="3" y="3" width="28" height="28" rx="4" /> <!-- Bottom right -->
        </g>
    </g>
</svg>