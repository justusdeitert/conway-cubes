<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        
        <!-- SEO Meta Tags -->
        <meta name="description" content="An interactive 3D visualization of Conway's Game of Life cellular automaton. Watch cells evolve through generations with various rule sets." />
        <meta name="keywords" content="Conway's Game of Life, cellular automaton, 3D visualization, interactive simulation, game of life" />
        <meta name="author" content="Conway Cubes" />
        
        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Conway's Game Of Life - 3D" />
        <meta property="og:description" content="An interactive 3D visualization of Conway's Game of Life cellular automaton." />
        <meta property="og:image" content="/icon-512.png" />
        
        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Conway's Game Of Life - 3D" />
        <meta name="twitter:description" content="An interactive 3D visualization of Conway's Game of Life cellular automaton." />
        <meta name="twitter:image" content="/icon-512.png" />
        
        <!-- Favicon & Icons -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#34d399" />
        
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <title>Conway's Game Of Life - 3D</title>
    </head>
    <body class="m-0 min-h-screen bg-[#0a0a0b] font-orbitron text-sm text-text-secondary overflow-hidden">
        <!-- Header -->
        <header class="glass-panel absolute top-0 left-0 right-0 px-6 py-5 z-10">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="/src/logo.svg" alt="Conway Cubes Logo" class="w-8 h-8" />
                    <h1 class="text-xl md:text-2xl font-bold tracking-wider text-text-primary m-0 uppercase">
                        Conway's Game Of Life
                    </h1>
                </div>
                <div class="flex items-center gap-3">
                    <label for="param-ruleset" class="text-xs text-text-muted uppercase tracking-wider hidden md:block">Rules</label>
                    <select
                        id="param-ruleset"
                        class="bg-[#1a1a1d] border border-[#2a2a2d] rounded-lg px-3 py-2 text-sm text-text-primary cursor-pointer hover:border-accent/50 focus:border-accent focus:outline-none transition-colors"
                        data-action="ruleset"
                    >
                        <option value="conway">Conway's Life (B3/S23)</option>
                        <option value="highlife">HighLife (B36/S23)</option>
                        <option value="twobytwo">2x2 (B36/S125)</option>
                        <option value="maze">Maze (B3/S12345)</option>
                        <option value="serviettes">Serviettes (B234/S)</option>
                        <option value="replicator">Replicator (B1357/S1357)</option>
                    </select>
                </div>
            </div>
        </header>

        <div id="viewport" class="relative z-2 -mt-12" style="perspective: 800px;"></div>

        <!-- Cycle Counter -->
        <div id="cyclecount" class="dynamic absolute bottom-[160px] left-0 right-0 z-100 text-5xl md:text-6xl text-center font-bold tracking-widest"></div>

        <!-- Controls Panel -->
        <footer id="controls" class="absolute bottom-0 left-0 right-0 px-6 py-5 z-10">
            <div class="flex items-end justify-between">
                <!-- Parameters - Stacked on Left -->
                <div class="flex flex-col gap-2">
                    <div class="slider-pill" title="Grid Size">
                        <span class="i-ph-grid-four-fill text-base text-text-muted"></span>
                        <input
                            id="param-gridsize"
                            class="slider-input"
                            type="range"
                            value="20"
                            min="8"
                            max="28"
                            step="4"
                            data-action="gridsize"
                        />
                        <div class="slider-value">20×20</div>
                    </div>

                    <div class="slider-pill" title="Initial Density">
                        <span class="i-ph-dots-six-fill text-base text-text-muted"></span>
                        <input
                            id="param-density"
                            class="slider-input"
                            type="range"
                            value="30"
                            min="0"
                            max="50"
                            step="5"
                            data-action="density"
                        />
                        <div class="slider-value">30%</div>
                    </div>

                    <div class="slider-pill" title="Simulation Speed">
                        <span class="i-ph-timer-fill text-base text-text-muted"></span>
                        <input
                            id="param-freq"
                            class="slider-input"
                            type="range"
                            value="2"
                            min="1"
                            max="4"
                            step="1"
                            data-action="freq"
                        />
                        <div class="slider-value">2 Hz</div>
                    </div>
                </div>

                <!-- Action Buttons - Modern Floating Pill -->
                <div class="action-pill">
                    <button
                        id="btn-start"
                        class="action-btn action-btn-primary two-state"
                        data-keycode="32"
                        data-action="start"
                        title="Play/Pause (Space)"
                    >
                        <span class="play i-ph-play-fill text-lg"></span>
                        <span class="pause i-ph-pause-fill text-lg"></span>
                    </button>

                    <button 
                        id="btn-step" 
                        class="action-btn" 
                        data-keycode="13" 
                        data-action="step"
                        title="Step (Return)"
                    >
                        <span class="i-ph-skip-forward-fill text-lg"></span>
                    </button>

                    <div class="action-divider"></div>

                    <button 
                        id="btn-stop" 
                        class="action-btn" 
                        disabled 
                        data-keycode="27" 
                        data-action="stop"
                        title="Reset (Esc)"
                    >
                        <span class="i-ph-arrow-counter-clockwise-bold text-lg"></span>
                    </button>
                </div>
            </div>
        </footer>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
